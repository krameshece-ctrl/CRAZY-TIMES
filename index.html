<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Times AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }

    .response-box {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 5px;
      min-height: 80px;
      margin-bottom: 15px;
      white-space: pre-wrap;
      color: #444;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0051a8;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <h1>Crazy Times AI</h1>
    <div id="response" class="response-box">Ask me anything...</div>
    <textarea id="chatbox" placeholder="Type your message here..."></textarea>
    <button onclick="sendPrompt()">Send</button>
  </div>

  <script>
    async function sendPrompt() {
      const chatbox = document.getElementById("chatbox");
      const responseDiv = document.getElementById("response");
      const userPrompt = chatbox.value.trim();

      if (!userPrompt) return;

      responseDiv.innerText = "Thinking...";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: userPrompt })
        });

        const data = await res.json();
        responseDiv.innerText = data.reply || data.error;
      } catch (err) {
        responseDiv.innerText = "Error connecting to server.";
      }
    }
  </script>

</body>
</html>
